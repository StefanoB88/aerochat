syntax = "proto3";
package aeromesh.v1;

// Messaggi trasportati in `InnerPayload.extra_data` (contratto iOS <-> Android).
// Il file Swift corrispondente (AeromeshExt.pb.swift) e' generato con protoc-gen-swift.

// Membro di un gruppo di viaggio annunciato dal Group Key Gossip.
message GroupMember {
  bytes node_id = 1;        // 8 byte
  bytes x25519_pub = 2;     // 32 byte
  bytes ed25519_pub = 3;    // 32 byte
  string nickname = 4;
}

// Inviato come pacchetto GROUP_KEY_GOSSIP *diretto* (recipient = node_id del membro, cifrato con la
// chiave ECDH 1-a-1): la group_secret_key viaggia quindi gia' cifrata individualmente per ciascun membro.
message GroupKeyGossip {
  bytes group_uuid = 1;             // 16 byte RFC 4122
  string group_title = 2;
  bytes group_secret_key = 3;       // 32 byte
  repeated GroupMember members = 4; // tutti i membri noti al mittente (incluso se stesso)
  int64 issued_at_ms = 5;
}

// Flight Group Pass: "1 paga, il gruppo usa". Firma Ed25519 dell'emittente su
// (group_uuid || valid_until_ms Int64 Big-Endian).
message ProPassGrant {
  bytes group_uuid = 1;
  int64 valid_until_ms = 2;
  bytes issuer_ed25519_pub = 3;
  string product_id = 4;            // com.aeromesh.pass72h | com.aeromesh.lifetime
  bytes signature = 5;              // 64 byte
}

enum GameKind {
  GAME_KIND_UNSPECIFIED = 0;
  TIC_TAC_TOE = 1;
  BATTLESHIP = 2;
  SCOPA = 3;      // carte napoletane, 2 giocatori, chat 1-a-1, a 11 punti
  SCOPONE = 4;    // Scopone scientifico, 4 giocatori in 2 squadre, chat di gruppo, a 11 punti
  BRISCOLA = 5;   // 2 giocatori, chat 1-a-1, una mano (120 punti carta)
}

enum GameAction {
  GAME_ACTION_UNSPECIFIED = 0;
  INVITE = 1;
  ACCEPT = 2;
  MOVE = 3;
  REPORT = 4;   // Battaglia navale: esito del colpo avversario
  RESIGN = 5;
  DEAL = 6;     // carte: il mazziere distribuisce una nuova mano (deck = ordine delle 40 carte)
}

enum ShotReport {
  SHOT_REPORT_UNSPECIFIED = 0;
  MISS = 1;
  HIT = 2;
  SUNK = 3;
}

// Mossa di un mini-gioco in chat (GAME_MOVE).
message GameMove {
  string game_id = 1;        // UUID della partita
  GameKind kind = 2;
  GameAction action = 3;
  uint32 sequence = 4;       // numero progressivo della mossa nella partita
  uint32 cell = 5;           // Tris: 0..8 (riga*3+col). Battaglia navale: 0..99 (riga*10+col)
  ShotReport report = 6;     // solo per action == REPORT
  bytes board_snapshot = 7;  // stato autorevole dopo la mossa (Tris: 9 byte 0/1/2)
  uint32 result = 8;         // 0 in corso, 1 vince il mittente, 2 vince il destinatario, 3 pareggio
  // Carte napoletane (Scopa, Scopone, Briscola): id carta 0..39 = seme*10 + (valore-1),
  // semi 0 denari, 1 coppe, 2 spade, 3 bastoni. Per DEAL `cell` = posto del mazziere,
  // per MOVE `cell` = id della carta giocata. `sequence` e' un contatore globale della partita.
  bytes deck = 9;              // DEAL: 40 byte, permutazione degli id carta 0..39
  bytes captured = 10;         // MOVE (Scopa/Scopone): id delle carte prese dal tavolo; vuoto = nessuna presa
  repeated bytes players = 11; // INVITE Scopone: 4 node_id (8 byte) in ordine di posto 0..3; posto 0 = chi invita
}

// Profilo pubblico (PROFILE_UPDATE, pacchetto diretto cifrato 1-a-1): inviato a ogni contatto quando
// cambia e a ogni vicino una volta per sessione radio. Il destinatario applica solo versioni piu' recenti.
message ProfileUpdate {
  string nickname = 1;
  string avatar_color_hex = 2; // 6 cifre esadecimali RGB, es. "00E5FF"
  bytes avatar_webp = 3;       // foto profilo WebP 128x128 (max 12 KB); vuoto = nessuna foto
  int64 updated_at_ms = 4;     // versione del profilo (Unix ms)
}

// Chiamate vocali in tempo reale: solo tra vicini diretti (ttl 1, nessun relay, nessuna coda).
enum CallAction {
  CALL_ACTION_UNSPECIFIED = 0;
  OFFER = 1;    // il chiamante propone la chiamata
  ACCEPT = 2;   // il chiamato risponde
  REJECT = 3;   // il chiamato rifiuta
  HANGUP = 4;   // uno dei due chiude (anche prima della risposta)
  BUSY = 5;     // il chiamato e' gia' in un'altra chiamata
}

message CallSignal {
  string call_id = 1;       // UUID minuscolo scelto dal chiamante
  CallAction action = 2;
}

// Audio: Opus 16 kHz mono, 20 ms per frame, 3 frame (60 ms) per pacchetto.
message CallAudio {
  string call_id = 1;
  uint32 sequence = 2;      // progressivo per pacchetto, parte da 1; i pacchetti fuori ordine/vecchi si scartano
  repeated bytes frames = 3;
}

// Quiz di cabina (QUIZ, multicast sulla Lounge con la sua chiave pubblica, mai in coda). Il conduttore
// (host) e' l'unica autorita': pubblica le domande, riceve le risposte, calcola e pubblica i punteggi.
enum QuizAction {
  QUIZ_ACTION_UNSPECIFIED = 0;
  QUESTION = 1;  // host -> tutti: domanda, opzioni e scadenza
  ANSWER = 2;    // giocatore -> tutti (l'host conta): indice scelto
  REVEAL = 3;    // host -> tutti: risposta giusta e classifica
  END = 4;       // host -> tutti: classifica finale
}

message QuizScore {
  bytes node_id = 1;   // 8 byte
  string nickname = 2;
  uint32 points = 3;
}

message QuizPacket {
  string quiz_id = 1;            // hex del msg_id del primo pacchetto dell'host
  QuizAction action = 2;
  uint32 round = 3;              // 1-based
  uint32 total_rounds = 4;
  string question = 5;           // QUESTION: nella lingua dell'host
  repeated string options = 6;   // QUESTION: 2..4 opzioni
  uint32 correct_index = 7;      // REVEAL
  uint32 answer_index = 8;       // ANSWER
  repeated QuizScore scores = 9; // REVEAL / END: classifica (max 32)
  bytes host_node_id = 10;       // 8 byte: solo i pacchetti dell'host guidano il quiz
  int64 deadline_ms = 11;        // QUESTION: dopo questo istante le risposte non contano
}

// Avviso di emergenza (EMERGENCY): multicast sulla Lounge, ttl massimo, resta in coda store-and-forward.
// Il destinatario lo mostra come banner prioritario e notifica "time sensitive".
enum EmergencyStatus {
  EMERGENCY_STATUS_UNSPECIFIED = 0;
  OK = 1;          // "Sto bene"
  NEED_HELP = 2;   // "Ho bisogno di aiuto"
  ALL_CLEAR = 3;   // cessato allarme / informazione
}

message EmergencyBroadcast {
  EmergencyStatus status = 1;
  string text = 2;            // max 280 caratteri
  double latitude = 3;        // solo se has_location
  double longitude = 4;
  bool has_location = 5;
  int64 issued_at_ms = 6;
}

// Modifica / cancellazione per tutti (MESSAGE_REVISION): inviata nella stessa conversazione
// del messaggio originale, con la stessa chiave e lo stesso recipient_id.
enum RevisionAction {
  REVISION_ACTION_UNSPECIFIED = 0;
  EDIT = 1;    // nuovo testo per un CHAT_TEXT / PUBLIC_LOUNGE
  DELETE = 2;  // cancellazione per tutti (testo, foto, nota vocale)
}

message MessageRevision {
  bytes target_msg_id = 1;   // 16 byte: msg_id del messaggio originale
  RevisionAction action = 2;
  string new_text = 3;       // solo EDIT, 1..4000 caratteri dopo trim
  int64 revised_at_ms = 4;   // istante della modifica (Unix ms)
}
